spring:
  datasource:
    url: jdbc:h2:mem:agent;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        enabled: false
  ai:
    mcp:
      client:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

index12306:
  agent:
    turn:
      submission-secret: test-turn-submission-secret-at-least-32-characters
      recovery-enabled: false
    stream:
      cleanup-enabled: false
    action:
      confirmation-secret: test-confirmation-secret-at-least-32-characters
      reconciliation:
        mq:
          enabled: false
    memory:
      mq:
        enabled: false
