
server:
  port: 9002

spring:
  application:
    name: index12306-ticket${unique-name:}-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    url: jdbc:mysql://192.168.126.100:3306/12306_ticket?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    hikari:
      connection-test-query: select 1
      connection-timeout: 3000
      idle-timeout: 300000
      maximum-pool-size: 80
      minimum-idle: 20
  data:
    redis:
      host: 192.168.126.100
      port: 6379
      password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.126.100:8848
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        import-check:
          enabled: false
      username: nacos
      password: nacos
    sentinel:
      transport:
        dashboard: localhost:8686
        port: 8719
rocketmq:
  name-server: 192.168.126.100:9876

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

framework:
  fastjson:
    safe-mode: true
  cache:
    redis:
      value-timeout: 16
      value-time-unit: days

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        loggerLevel: HEADERS
        readTimeout: 5000
  httpclient:
    enabled: false
  okhttp:
    enabled: true

index12306:
  reliable-command:
    execution-lease-millis: 120000
    heartbeat-interval-millis: 30000
  ticket:
    operation:
      recovery-interval-millis: 5000
      reconcile-max-attempts: 5
      reconcile-retry-delay-millis: 30000
      reconcile-lease-millis: 120000
    reservation-recovery:
      interval-millis: 5000
      timeout-millis: 60000
      batch-size: 100
      # 仅回收 loadtest 前缀、无 Outbox 的历史孤儿预占；完成本次清理后应立即改回 false。
      loadtest-orphan-release:
        enabled: false
      backlog-refresh-interval-millis: 15000
  ratelimiter:
    # 是否信任 X-Forwarded-For，仅当前面有可信反向代理会清洗重写该头时才能开启，否则可被伪造绕过限流
    trust-forwarded-header: false
  captcha:
    tencent:
      # 默认关闭，未在腾讯云控制台申请验证码 AppID/AppSecretKey 前不会强制要求验证码
      enabled: false
      app-id:
      app-secret-key:

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: ${spring.application.name}
